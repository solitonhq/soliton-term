name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RCODESIGN_VERSION: "0.29.0"

jobs:
  macos:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest # Apple Silicon runner; Intel is cross-compiled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rcodesign signs with a plain .p12 (no Apple account, no trust settings).
      # Built from crates.io at a pinned version rather than downloading a binary.
      - name: Cache rcodesign
        id: rcodesign-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rcodesign
          key: rcodesign-${{ env.RCODESIGN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install rcodesign
        if: steps.rcodesign-cache.outputs.cache-hit != 'true'
        run: cargo install apple-codesign --locked --version "$RCODESIGN_VERSION"

      - run: npm ci

      - name: Check signing secrets
        env:
          P12: ${{ secrets.SOLITON_SIGNING_P12 }}
          PW: ${{ secrets.SOLITON_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] && [ -n "$PW" ] || { echo "::error::Set SOLITON_SIGNING_P12 and SOLITON_SIGNING_P12_PASSWORD (see docs/SIGNING.md)"; exit 1; }

      - name: Build, sign and package
        env:
          P12_B64: ${{ secrets.SOLITON_SIGNING_P12 }}
          SOLITON_SIGNING_P12_PASSWORD: ${{ secrets.SOLITON_SIGNING_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          SOLITON_SIGNING_P12="$RUNNER_TEMP/signing.p12" scripts/package-macos.sh "${{ matrix.target }}"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Soliton Term $GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md. Builds are signed with a self-signed identity, not notarized: on first launch run \`xattr -cr \"/Applications/Soliton Term.app\"\`."
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber
