version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      xterm:
        patterns: ["@xterm/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
