[package]
name = "soliton-term"
version = "0.1.1"
description = "Soliton Term — Hybrid Termius & RDM SSH Manager for macOS"
authors = ["Soliton Term contributors"]
license = "Apache-2.0"
repository = "https://github.com/solitonhq/soliton-term"
homepage = "https://solitonhq.github.io/products/soliton-term/"
edition = "2021"

[lib]
name = "soliton_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
portable-pty = "0.8"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
